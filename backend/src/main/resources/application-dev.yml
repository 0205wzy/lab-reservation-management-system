spring:
  server:
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    # 开发环境为内存库，重启会清空并重新执行 schema/data；生产请配置持久化数据库。
    url: jdbc:h2:mem:lab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  h2:
    console:
      enabled: true
