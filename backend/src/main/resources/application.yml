server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: lab-management
  server:
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  sql:
    init:
      encoding: UTF-8
  datasource:
    url: jdbc:mysql://localhost:3306/lab_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
mybatis:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: lab-management-system-secret-key-2026-change-me
  expiration: 86400000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
ai:
  enabled: ${AI_ENABLED:false}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout: ${AI_TIMEOUT:15}
